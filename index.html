<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Predicación</title></head><body>
<iframe class="map" title="Mapa de territorios" loading="lazy" allowfullscreen
 src="https://www.google.com/maps/d/embed?mid=1H8j2hSNLHMMxyiIiBI___XOZpPDxobc&ll=-33.1185198147293%2C-71.5801330577226&z=16"></iframe>
<main>
<div class="hero noprint"><span class="eyebrow">Registro</span><h1>Congregación <em>Curauma</em></h1><p class="sub">Casas y hermanos disponibles para la predicación, por día y turno.</p></div>
<div class="grid" style="grid-template-columns:1fr">
 <section class="card"><span class="eyebrow">Territorios</span><h2>Casas disponibles <span class="badge" id="nc"></span></h2>
  <div class="fl" id="fcd"></div><div class="fl" id="fct"></div><div id="lc0"></div></section>
 <section class="card"><span class="eyebrow">Grupos</span><h2>Varones disponibles <span class="badge" id="nv"></span></h2>
  <small>Pueden sacar grupo ese día</small><div class="fl" id="fvd"></div><div id="lv0"></div></section>
</div>

<div class="bar noprint"><small id="who"></small><span class="sp"></span>
 <button id="bh" class="pri">Añadir Hermanos</button><button id="bc">Añadir Casas</button><button id="saveBtn" class="pri" hidden disabled>Guardar en GitHub</button></div>

<section class="card" id="ph" hidden><h2>Hermanos</h2>
 <form id="fh">
  <input name="nombre" placeholder="Nombre" required>
  <input name="tarea" placeholder="Tarea (AN, SM, PTJ…)" size="14">
  <label class="chk"><input type="checkbox" name="grupo" checked>Puede sacar grupo</label>
  <select name="turno"><option value="MT">Mañana y tarde</option><option value="M">Mañana</option><option value="T">Tarde</option></select>
  <span id="fhd"></span><button class="pri">Añadir</button>
 </form><div id="lh"></div></section>

<section class="card" id="pc" hidden><h2>Casas</h2>
 <form id="fc">
  <input name="nombre" placeholder="Familia (ej. Fam. Cabezas)" required>
  <input name="dir" placeholder="Dirección" required>
  <input name="terr" placeholder="Territorio" size="8">
  <select name="turno"><option value="MT">Mañana y tarde</option><option value="M">Mañana</option><option value="T">Tarde</option></select>
  <span id="fcdd"></span><button class="pri">Añadir</button>
 </form><div id="lc"></div></section>
</main>
<script src="app.js"></script>
<script>
shell('i');
let AUTH=false,fd=new Date().getDay(),fv=fd,ft='';
const TN={MT:'Mañana y tarde',M:'Mañana',T:'Tarde'};
const uid=()=>Math.random().toString(36).slice(2,9);
const boxes=n=>ORDEN.map(d=>`<label class=chk><input type=checkbox name=d value=${d} ${d>0?'checked':''}>${DIAS[d].slice(0,3)}</label>`).join('');
const dchips=(sel,a)=>ORDEN.map(d=>`<span class="chip ${d==sel?'on':''}" data-${a}=${d} tabindex=0>${DIAS[d].slice(0,3)}</span>`).join('');
$('#fhd').innerHTML=boxes();$('#fcdd').innerHTML=boxes();

const RG={AN:'Anciano',SM:'Siervo ministerial',PR:'Precursor regular',PE:'Precursor especial',PA:'Precursor auxiliar',PTJ:'Publicador',SC:'Superintendente de circuito'};
const rango=t=>esc((t||'').split('/').map(x=>RG[x.trim()]||x.trim()).filter(Boolean).join(' · ')||'Publicador');
function cards(){
 $('#fcd').innerHTML=dchips(fd,'fd');$('#fvd').innerHTML=dchips(fv,'fv');
 $('#fct').innerHTML=[['','Todos'],['M','Mañana'],['T','Tarde']].map(([v,l])=>`<span class="chip ${ft==v?'on':''}" data-ft="${v}" tabindex=0>${l}</span>`).join('');
 const C=DB.casas.filter(x=>x.activa!==false&&x.dias.includes(fd)&&(!ft||turnoOk(x.turno,ft)));
 const V=DB.hermanos.filter(x=>x.grupo&&x.activa!==false&&x.dias.includes(fv));
 $('#nc').textContent=C.length;$('#nv').textContent=V.length;
 $('#lc0').innerHTML=C.length?`<div class=cg>${C.map(x=>`<article class=cc><b>${esc(x.nombre)}</b><span class=ad>📍 ${esc(x.dir||'Sin dirección')}</span><span class="tag acc">Territorio ${esc(x.terr||'—')}</span></article>`).join('')}</div>`:'<small>Sin casas para este filtro.</small>';
 $('#lv0').innerHTML=V.length?`<div class=cg>${V.map(x=>`<article class=vc><div class=vh><b>${esc(x.nombre)}</b><span class="tag rg">${rango(x.tarea)}</span></div>
  <div class=vd title="Días disponibles">${ORDEN.map(d=>`<span class="dd ${x.dias.includes(d)?'on':''} ${d==fv?'sel':''}">${DIAS[d].slice(0,2)}</span>`).join('')}</div>
  <div class=vt><small>Saca grupo:</small><span class="tg ${turnoOk(x.turno,'M')?'on':''}">☀ Mañana</span><span class="tg ${turnoOk(x.turno,'T')?'on':''}">🌙 Tarde</span></div></article>`).join('')}</div>`:'<small>Nadie disponible ese día.</small>';
}
function item(k,x){
 const h=k=='hermanos',g=!h||x.grupo;
 const sub=h?[x.tarea,x.gr?'Gr. '+x.gr:''].filter(Boolean).join(' · '):(x.dir||'')+(x.terr?' · Terr. '+x.terr:'');
 return `<div class=item data-k=${k} data-id=${x.id}><div><b>${esc(x.nombre)}</b> <small>${esc(sub)}</small></div>
 ${h?`<label class=chk><input type=checkbox data-g ${x.grupo?'checked':''}>Puede sacar grupo</label>`:''}
 <div>${g?ORDEN.map(d=>`<span class="chip ${x.dias.includes(d)?'on':''}" data-d=${d} title="${h?'Día en que saca grupo':'Día disponible'}">${DIAS[d].slice(0,2)}</span>`).join(''):''}</div>
 <select data-t>${Object.keys(TN).map(t=>`<option value=${t} ${x.turno==t?'selected':''}>${TN[t]}</option>`).join('')}</select>
 <label class=chk><input type=checkbox data-a ${x.activa!==false?'checked':''}>Disponible</label><button data-del title="Eliminar">✕</button></div>`;
}
function render(){
 cards();
 if(!AUTH)return;
 $('#lc').innerHTML=DB.casas.map(x=>item('casas',x)).join('')||'<small>Aún no hay casas.</small>';
 const G=DB.hermanos.filter(x=>x.grupo),O=DB.hermanos.filter(x=>!x.grupo);
 $('#lh').innerHTML=(G.length?`<h3>Pueden sacar grupo (${G.length})</h3>`+G.map(x=>item('hermanos',x)).join(''):'<small>Nadie marcado para sacar grupo.</small>')+(O.length?`<h3>Otros hermanos (${O.length})</h3>`+O.map(x=>item('hermanos',x)).join(''):'');
}
function dirty(){$('#saveBtn').disabled=false;}
function add(e,k){
 e.preventDefault();const f=new FormData(e.target),h=k=='hermanos',g=h&&!!f.get('grupo');
 DB[k].push({id:uid(),nombre:f.get('nombre'),turno:f.get('turno'),dias:(!h||g)?f.getAll('d').map(Number):[],activa:true,...(h?{tarea:f.get('tarea')||'',gr:'',grupo:g}:{dir:f.get('dir')||'',terr:f.get('terr')||''})});
 e.target.reset();render();dirty();
}
$('#fc').onsubmit=e=>add(e,'casas');$('#fh').onsubmit=e=>add(e,'hermanos');
const find=el=>{const it=el.closest('.item');return it&&[DB[it.dataset.k],DB[it.dataset.k].find(x=>x.id==it.dataset.id)];};
document.addEventListener('click',e=>{
 const ds=e.target.dataset||{};
 if('fd' in ds){fd=+ds.fd;return cards();}if('fv' in ds){fv=+ds.fv;return cards();}if('ft' in ds){ft=ds.ft;return cards();}
 const r=find(e.target);if(!r||!AUTH)return;const [arr,x]=r;
 if(ds.d!==undefined){const d=+ds.d;x.dias=x.dias.includes(d)?x.dias.filter(v=>v!=d):[...x.dias,d];render();dirty();}
 if(ds.del!==undefined&&confirm('¿Eliminar '+x.nombre+'?')){arr.splice(arr.indexOf(x),1);render();dirty();}
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.classList.contains('chip')&&!e.target.closest('.item'))e.target.click();});
document.addEventListener('change',e=>{
 const r=find(e.target);if(!r||!AUTH)return;const x=r[1],ds=e.target.dataset;
 if('g' in ds){x.grupo=e.target.checked;if(x.grupo&&!x.dias.length)x.dias=[...ORDEN];render();}
 if('t' in ds)x.turno=e.target.value;if('a' in ds)x.activa=e.target.checked;dirty();cards();
});
function gate(id,panel,other){
 $(id).onclick=()=>{
  if(!AUTH){toast('Ingresa un token válido para editar');return $('#cfgBtn').click();}
  const p=$(panel);p.hidden=!p.hidden;if(!p.hidden)$(other).hidden=true;
 };
}
gate('#bh','#ph','#pc');gate('#bc','#pc','#ph');
$('#saveBtn').onclick=async()=>{try{await save();$('#saveBtn').disabled=true;toast('Guardado en GitHub');}catch(e){toast('Error: '+e.message);}};
load().then(async()=>{
 AUTH=await auth();
 $('#who').textContent=AUTH?'🔓 Edición habilitada':(cfg().token?'⚠ Token inválido o sin permiso · solo lectura':'🔒 Solo lectura');
 ['#bh','#bc'].forEach(s=>$(s).textContent=(AUTH?'':'🔒 ')+$(s).textContent);
 $('#saveBtn').hidden=!AUTH;render();
});
</script></body></html>
