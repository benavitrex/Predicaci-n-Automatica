<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Casas y hermanos</title></head><body>
<main>
<div class=noprint style="display:flex;gap:8px;align-items:center"><button id=saveBtn class=pri disabled>Guardar en GitHub</button><small id=dirty></small></div>

<h2>Casas</h2>
<section class=box><form id=fc>
 <input name=nombre placeholder="Familia (ej. Fam. Cabezas)" required>
 <input name=dir placeholder="Dirección" required>
 <input name=terr placeholder="Territorio" size=8>
 <select name=turno><option value=MT>Mañana y tarde</option><option value=M>Mañana</option><option value=T>Tarde</option></select>
 <span id=fcd></span><button class=pri>Añadir casa</button>
</form></section>
<div id=lc></div>

<h2>Hermanos</h2>
<section class=box><form id=fh>
 <input name=nombre placeholder="Nombre" required>
 <input name=tarea placeholder="Tarea (AN, SM, PTJ…)" size=14>
 <label class=chk><input type=checkbox name=grupo checked>Puede sacar grupo</label>
 <select name=turno><option value=MT>Mañana y tarde</option><option value=M>Mañana</option><option value=T>Tarde</option></select>
 <span id=fhd></span><button class=pri>Añadir hermano</button>
</form></section>
<div id=lh></div>
</main>
<script src="app.js"></script>
<script>
shell('i');
const uid=()=>Math.random().toString(36).slice(2,9);
const boxes=n=>ORDEN.map(d=>`<label class=chk><input type=checkbox name=${n} value=${d} ${d>0?'checked':''}>${DIAS[d].slice(0,3)}</label>`).join('');
$('#fcd').innerHTML=boxes('d');$('#fhd').innerHTML=boxes('d');
const TN={MT:'Mañana y tarde',M:'Mañana',T:'Tarde'};

function item(k,x){
 const h=k=='hermanos',g=!h||x.grupo;
 const sub=h?[x.tarea,x.gr?'Gr. '+x.gr:''].filter(Boolean).join(' · '):(x.dir||'')+(x.terr?' · Terr. '+x.terr:'');
 return `<div class=item data-k=${k} data-id=${x.id}><div><b>${esc(x.nombre)}</b> <small>${esc(sub)}</small></div>
 ${h?`<label class=chk><input type=checkbox data-g ${x.grupo?'checked':''}>Puede sacar grupo</label>`:''}
 <div>${g?ORDEN.map(d=>`<span class="chip ${x.dias.includes(d)?'on':''}" data-d=${d} title="${h?'Día en que saca grupo':'Día disponible'}">${DIAS[d].slice(0,2)}</span>`).join(''):''}</div>
 <select data-t>${Object.keys(TN).map(t=>`<option value=${t} ${x.turno==t?'selected':''}>${TN[t]}</option>`).join('')}</select>
 <label class=chk><input type=checkbox data-a ${x.activa!==false?'checked':''}>Disponible</label><button data-del title="Eliminar">✕</button></div>`;
}
function render(){
 $('#lc').innerHTML=DB.casas.map(x=>item('casas',x)).join('')||'<small>Aún no hay casas. Añade la primera arriba.</small>';
 const G=DB.hermanos.filter(x=>x.grupo),O=DB.hermanos.filter(x=>!x.grupo);
 $('#lh').innerHTML=(G.length?`<h3>Pueden sacar grupo (${G.length})</h3>`+G.map(x=>item('hermanos',x)).join(''):'<small>Nadie marcado para sacar grupo.</small>')+(O.length?`<h3>Otros hermanos (${O.length})</h3>`+O.map(x=>item('hermanos',x)).join(''):'');
}
function dirty(){$('#saveBtn').disabled=false;$('#dirty').textContent='Cambios sin guardar';}
function add(e,k){
 e.preventDefault();const f=new FormData(e.target);
 const h=k=='hermanos',g=h&&!!f.get('grupo');
 DB[k].push({id:uid(),nombre:f.get('nombre'),turno:f.get('turno'),dias:(!h||g)?f.getAll('d').map(Number):[],activa:true,...(h?{tarea:f.get('tarea')||'',gr:'',grupo:g}:{dir:f.get('dir')||'',terr:f.get('terr')||''})});
 e.target.reset();render();dirty();
}
$('#fc').onsubmit=e=>add(e,'casas');$('#fh').onsubmit=e=>add(e,'hermanos');
const find=el=>{const it=el.closest('.item');return it&&[DB[it.dataset.k],DB[it.dataset.k].find(x=>x.id==it.dataset.id),it];};
document.addEventListener('click',e=>{
 const r=find(e.target);if(!r)return;const [arr,x]=r;
 if(e.target.dataset.d!==undefined){const d=+e.target.dataset.d;x.dias=x.dias.includes(d)?x.dias.filter(v=>v!=d):[...x.dias,d];render();dirty();}
 if(e.target.dataset.del!==undefined&&confirm('¿Eliminar '+x.nombre+'?')){arr.splice(arr.indexOf(x),1);render();dirty();}
});
document.addEventListener('change',e=>{
 const r=find(e.target);if(!r)return;const x=r[1];
 if('g' in e.target.dataset){x.grupo=e.target.checked;if(x.grupo&&!x.dias.length)x.dias=[...ORDEN];render();}
 if('t' in e.target.dataset)x.turno=e.target.value;if('a' in e.target.dataset)x.activa=e.target.checked;dirty();
});
$('#saveBtn').onclick=async()=>{try{await save();$('#saveBtn').disabled=true;$('#dirty').textContent='';toast('Guardado en GitHub');}catch(e){toast('Error: '+e.message);}};
load().then(render);
</script></body></html>
