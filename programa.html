<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Programa</title></head><body>
<main>
<section class="box noprint"><form id=f>
 <label class=chk>Desde <input type=date id=d1 required></label>
 <label class=chk>Hasta <input type=date id=d2 required></label>
 <button class=pri>Generar programa</button><button type=button id=pr>Imprimir / PDF</button>
</form>
<div id=hor style="padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px"></div></section>
<h2 id=tit>Programa</h2>
<table><thead><tr><th>Fecha</th><th>Hora</th><th>Encargado</th><th>Lugar de encuentro</th><th>Territorio</th></tr></thead><tbody id=tb></tbody></table>
</main>
<script src="app.js"></script>
<script>
shell('p');
const H=JSON.parse(localStorage.getItem('pj_hor')||'null')||{0:['10:30',1],1:['10:00',1],2:['10:00',1],3:['10:00',1],4:['10:00',1],5:['10:00',1],6:['10:30',1]};
$('#hor').innerHTML=ORDEN.map(d=>`<div><b>${DIAS[d]}</b><br><input data-h=${d} value="${H[d][0]}" size=11 placeholder="10:00, 18:00"> <input data-n=${d} type=number min=0 max=6 value=${H[d][1]} style="width:52px" title="Salidas por horario"></div>`).join('');
let ROWS=[];
const fmt=d=>d.toLocaleDateString('es-CL',{weekday:'long',day:'2-digit'}).toUpperCase();
const pick=(arr,u,l)=>arr.sort((a,b)=>(u[a.id]||0)-(u[b.id]||0)||(l[a.id]??-1)-(l[b.id]??-1))[0];

function gen(){
 document.querySelectorAll('[data-h]').forEach(i=>{H[i.dataset.h]=[i.value,H[i.dataset.h][1]];});
 document.querySelectorAll('[data-n]').forEach(i=>{H[i.dataset.n][1]=+i.value;});
 localStorage.setItem('pj_hor',JSON.stringify(H));
 const p=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c);};
 let d=p($('#d1').value);const end=p($('#d2').value);
 const uC={},lC={},uH={},lH={};let i=0;ROWS=[];
 for(;d<=end;d.setDate(d.getDate()+1),i++){
  const dow=d.getDay(),[hs,n]=H[dow],date=new Date(d),hUsed=new Set();
  for(const hora of hs.split(',').map(s=>s.trim()).filter(Boolean)){
   const t=hora<'14:00'?'M':'T',cUsed=new Set();
   for(let g=1;g<=n;g++){
    const c=pick(DB.casas.filter(x=>x.activa!==false&&x.dias.includes(dow)&&turnoOk(x.turno,t)&&!cUsed.has(x.id)),uC,lC);
    const h=pick(DB.hermanos.filter(x=>x.activa!==false&&x.dias.includes(dow)&&turnoOk(x.turno,t)&&!hUsed.has(x.id)),uH,lH);
    if(c){cUsed.add(c.id);uC[c.id]=(uC[c.id]||0)+1;lC[c.id]=i;}
    if(h){hUsed.add(h.id);uH[h.id]=(uH[h.id]||0)+1;lH[h.id]=i;}
    ROWS.push({date,hora,g:n>1?g:0,c:c?.id,h:h?.id});
   }
  }
 }
 render();
}
const opts=(a,sel)=>`<option value="">— sin asignar —</option>`+a.map(x=>`<option value=${x.id} ${x.id==sel?'selected':''}>${esc(x.nombre)}</option>`).join('');
function render(){
 $('#tit').textContent='Programa del '+(ROWS[0]?.date.toLocaleDateString('es-CL')||'')+' al '+(ROWS.at(-1)?.date.toLocaleDateString('es-CL')||'');
 $('#tb').innerHTML=ROWS.map((r,k)=>{
  const c=DB.casas.find(x=>x.id==r.c);
  return `<tr data-k=${k}><td>${fmt(r.date)}</td><td>${r.hora}${r.g?' <small>Grupo '+r.g+'</small>':''}</td>
  <td><select data-s=h>${opts(DB.hermanos,r.h)}</select></td>
  <td><select data-s=c>${opts(DB.casas,r.c)}</select>${c?`<small>${esc(c.dir)}</small>`:'<small class=warn>Sin casa disponible</small>'}</td>
  <td>${esc(c?.terr||'')}</td></tr>`;}).join('');
}
$('#tb').onchange=e=>{const s=e.target.dataset.s;if(!s)return;ROWS[+e.target.closest('tr').dataset.k][s]=e.target.value;render();};
$('#f').onsubmit=e=>{e.preventDefault();gen();};
$('#pr').onclick=()=>print();
const t=new Date(),m=new Date(t);m.setDate(t.getDate()+(8-t.getDay())%7||7);const e2=new Date(m);e2.setDate(m.getDate()+13);
const iso=d=>d.toLocaleDateString('sv');$('#d1').value=iso(m);$('#d2').value=iso(e2);
load().then(()=>toast(DB.casas.length+' casas · '+DB.hermanos.length+' hermanos'));
</script></body></html>
